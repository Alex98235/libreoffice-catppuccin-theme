name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate syntax
        run: python3 -m py_compile scripts/build.py
      - name: Build the published extensions
        run: python3 scripts/build.py

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9-]+\))?!?: [a-z].+$'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR title must be a Conventional Commit, e.g. 'feat(api): add context endpoint'."
            exit 1
          fi
          echo "PR title is valid: $PR_TITLE"
